<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
    <title>Coranu - Thoughts & Stories</title>
</head>
<body>
    <!-- Persistent Navbar -->
    <nav class="max-w-7xl mx-auto px-6 py-6 flex justify-between items-center sticky top-0 bg-white/90 backdrop-blur-md z-50 border-b border-gray-50">
        <a href="index.html" class="flex items-center gap-2">
            <div class="w-6 h-6 bg-blue-600 rounded-full"></div>
            <span class="text-2xl font-black tracking-tighter">Coranu</span>
        </a>
        <div id="nav-actions">
            <!-- JS will inject buttons here -->
        </div>
    </nav>

    <!-- Header -->
    <header class="max-w-7xl mx-auto px-6 py-20 text-center">
        <h1 class="text-6xl md:text-8xl font-black tracking-tighter mb-8 leading-none text-gray-900">Thoughts, Ideas,<br>& Stories.</h1>
        <div class="h-px bg-gray-100 mt-16 max-w-4xl mx-auto"></div>
    </header>

    <!-- Category Filter -->
    <div class="max-w-7xl mx-auto px-6 mb-12 flex flex-wrap gap-3 justify-center" id="category-list">
        <!-- Categories from JS -->
    </div>

    <!-- Blog Grid -->
    <main class="max-w-7xl mx-auto px-6 pb-24">
        <div id="blog-grid" class="grid grid-cols-1 md:grid-cols-3 gap-12">
            <!-- Blogs from JS -->
        </div>
    </main>

    <script type="module" src="js/app.js"></script>
</body>
</html>
