<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
    <title>Join Coranu</title>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-6 bg-[url('https://grainy-gradients.vercel.app/noise.svg')]">
    <div class="absolute inset-0 bg-gradient-to-tr from-blue-50 via-white to-blue-50 -z-10"></div>
    <div class="max-w-md w-full bg-white/80 backdrop-blur-xl p-10 rounded-[32px] shadow-xl border border-white/50 relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-blue-400 to-blue-600"></div>
        <div class="text-center mb-10">
            <div class="w-10 h-10 bg-blue-600 rounded-xl mx-auto mb-4 shadow-lg shadow-blue-200 rotate-3 flex items-center justify-center">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
            </div>
            <h2 id="title" class="text-3xl font-extrabold tracking-tight text-slate-900">Welcome Back</h2>
            <p class="text-slate-500 text-sm mt-2 font-medium">Enter your details to access your space.</p>
        </div>

        <form id="auth-form" class="space-y-4">
            <!-- Signup Only Fields -->
            <div id="signup-fields" class="space-y-4 hidden">
                <div class="flex flex-col items-center mb-4">
                    <img id="pfp-preview" src="https://via.placeholder.com/80" class="w-20 h-20 rounded-full object-cover mb-2 border-2 border-blue-100">
                    <input type="file" id="pfp-input" class="hidden" accept="image/*">
                    <label for="pfp-input" class="text-blue-600 text-xs font-bold cursor-pointer uppercase">Upload Photo</label>
                </div>
                <input type="text" id="full-name" placeholder="Full Name" class="input-field">
                <input type="text" id="username" placeholder="Username (@creative)" class="input-field">
            </div>

            <input type="email" id="email" placeholder="Email Address" class="input-field" required>
            <input type="password" id="password" placeholder="Password" class="input-field" required>
            
            <button type="submit" id="submit-btn" class="btn-primary w-full justify-center py-4">SIGN IN →</button>
        </form>

        <p class="text-center mt-6 text-sm text-gray-500">
            <span id="toggle-text">Don't have an account?</span>
            <button id="toggle-btn" class="text-blue-600 font-bold ml-1">Signup</button>
        </p>
    </div>

    <script type="module" src="js/auth.js"></script>
</body>
</html>
